name: 기출 업데이트 & 배포

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST — 신규 시험·확정정답 확인, 해설 배치 수거·예산 안에서 신규 제출
  workflow_dispatch:
    inputs:
      explain_limit:
        description: "API 해설: 이번 실행에서 요청할 최대 문항 수 (비우면 예산 안에서 가능한 만큼)"
        required: false
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: 기출 수집
        run: python pipeline/scrape.py

      - name: 문항 분할
        run: python pipeline/segment.py

      # 큐넷 국가전문자격: 사이트에 연 시험(exams.json status live)만, 새 게시물만 받는다
      - name: 큐넷 기출 수집
        run: |
          for gid in $(python -c "import json;print(' '.join(e['qnet'] for e in json.load(open('web/src/exams.json'))['exams'] if e.get('qnet') and e['status']=='live'))"); do
            python pipeline/qnet.py fetch "$gid"
            python pipeline/qnet_answers.py prepare "$gid"
          done

      # 공무원(9급·7급·지방직): 정답표가 글자 PDF 라 API 없이 읽는다. 최근 2년치만 확인
      - name: 공무원 기출 수집
        run: |
          python pipeline/gosi.py --since=$(( $(date -u +%Y) - 1 ))
          python pipeline/build_index.py

      # Claude API 인증은 Workload Identity Federation: 저장된 API 키 없이 실행마다 GitHub OIDC 토큰을
      # 단기 토큰으로 교환한다(SDK 가 아래 환경 변수를 읽어 자동 처리). ID 값들은 비밀이 아니라 repo 변수로 둔다.
      - name: 해설 (배치 수거 → 신규 제출)
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
        run: |
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] || unset ANTHROPIC_WORKSPACE_ID
          # GitHub OIDC 토큰은 몇 분이면 만료된다. API 를 쓰는 명령마다 새로 받아 둔다
          jwt() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          jwt
          # 제출이 길어지면(수천 건) 실행 중에도 만료되므로 2분마다 새로 받아 둔다
          ( while sleep 120; do jwt || true; done ) &
          JWT_LOOP=$!
          trap 'kill $JWT_LOOP 2>/dev/null || true' EXIT
          # 인증·Batches 권한 확인 (토큰 비용 없음)
          python -c "import anthropic; c = anthropic.Anthropic(); c.models.retrieve('claude-opus-5-5'); list(c.messages.batches.list(limit=1)); print('Claude API 인증 OK')"
          # 새 큐넷 최종정답표: 그림이라 API 로 두 번 읽어 같을 때만 반영 → 문제지 만들기
          for spec in $(python -c "import json;print(' '.join(e['qnet']+':'+str(e['choices']) for e in json.load(open('web/src/exams.json'))['exams'] if e.get('qnet') and e['status']=='live'))"); do
            jwt
            python pipeline/qnet_answers.py read-api "${spec%%:*}" "${spec##*:}" || true
          done
          python pipeline/qnet_build.py
          # 스캔본 큐넷 문제지(data/scan/jobs.json): 쪽마다 문항 위치를 두 번 읽어 맞으면 확정 → 다 되면 문제지로
          jwt
          python pipeline/scan.py collect
          python pipeline/scan.py build
          jwt
          python pipeline/scan.py submit
          # 문항 텍스트 변환: 끝난 배치 수거 → 범위(data/convert_state.json scope) 안의 새 문항 제출
          jwt
          python pipeline/convert.py collect
          jwt
          # 한 번에 12,000문항까지 (작업 시간 60분 안에 끝나 상태가 커밋되도록). 나머지는 다음 실행에서
          python pipeline/convert.py submit --limit 12000
          python pipeline/build_index.py
          jwt
          python pipeline/explain.py collect
          jwt
          # 예산(data/explain_budget.json) 안에서 새 기출 먼저, 그다음 우선순위 순. 수동 실행에서 explain_limit 를 주면 그 수 이하로
          python pipeline/explain.py submit --auto ${{ inputs.explain_limit && format('--limit {0}', inputs.explain_limit) || '' }}
          # AI 모의고사 문항 창고: 평가 반영(나쁜 문항 빼기) → 만들기·검토 배치 수거 → 이번 달 예산(data/mock/config.json) 안에서 새로 제출
          jwt
          python pipeline/mock_gen.py run || true

      - name: 변경 사항 커밋
        run: |
          git config user.name "psat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data
          git diff --cached --quiet || git commit -m "data: 자동 업데이트 $(date -u +%F)"
          # 실행 중에 코드가 푸시됐으면 그 위에 얹어서 올린다 (배치 상태 파일을 잃지 않도록; 같은 파일이 겹치면 이 실행의 데이터를 쓴다)
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_CONTACT: ${{ vars.CONTACT }}
          VITE_AD_CLIENT: ${{ vars.AD_CLIENT }}
          VITE_PDF_BASE: ${{ vars.PDF_BASE }}

      # 문제지 PDF 는 Cloudflare Pages(alltests-pdf → pdf.alltests.ai.kr)에 따로 올린다.
      # GitHub Pages 한 사이트 1GB 한도를 넘지 않게. 바뀐 파일만 올라간다(Wrangler 가 해시로 비교).
      - name: PDF 배포 (Cloudflare Pages)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p "$RUNNER_TEMP/pdfsite"
          cp -r web/public/data/pdf/. "$RUNNER_TEMP/pdfsite/"
          # 사이트(alltests.ai.kr)의 pdf.js 가 다른 주소에서 읽으므로 CORS 허용, 파일 이름이 내용 해시라 오래 캐시
          printf '/*\n  Access-Control-Allow-Origin: *\n  Cache-Control: public, max-age=604800\n' > "$RUNNER_TEMP/pdfsite/_headers"
          npx -y wrangler@4 pages project create alltests-pdf --production-branch=main || true
          npx -y wrangler@4 pages deploy "$RUNNER_TEMP/pdfsite" --project-name=alltests-pdf --branch=main --commit-dirty=true

      # PDF 를 따로 두면 GitHub Pages 쪽에서는 뺀다
      - if: vars.PDF_BASE != ''
        run: rm -rf web/dist/data/pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      # GitHub 가 방금 올린 artifact 를 못 찾을 때가 있다("No artifacts named github-pages"): 30초 뒤 한 번 더
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
