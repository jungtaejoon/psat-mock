name: 기출 업데이트 & 배포

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST — 신규 시험·확정정답 확인, 해설 배치 수거
  workflow_dispatch:
    inputs:
      explain_limit:
        description: "이번 실행에서 새로 해설을 요청할 최대 문항 수 (비우면 전부)"
        required: false
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: 기출 수집
        run: python pipeline/scrape.py

      - name: 문항 분할
        run: python pipeline/segment.py

      - name: 해설 (배치 수거 → 신규 제출)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          python pipeline/explain.py collect
          python pipeline/explain.py submit ${{ inputs.explain_limit && format('--limit {0}', inputs.explain_limit) || '' }}

      - name: 변경 사항 커밋
        run: |
          git config user.name "psat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data
          git diff --cached --quiet || git commit -m "data: 자동 업데이트 $(date -u +%F)"
          git push

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_CONTACT: ${{ vars.CONTACT }}
          VITE_AD_CLIENT: ${{ vars.AD_CLIENT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
