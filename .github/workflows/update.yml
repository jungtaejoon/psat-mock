name: 기출 업데이트 & 배포

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST — 신규 시험·확정정답 확인, 해설 배치 수거
  workflow_dispatch:
    inputs:
      explain_limit:
        description: "이번 실행에서 새로 해설을 요청할 최대 문항 수 (비우면 전부)"
        required: false
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: 기출 수집
        run: python pipeline/scrape.py

      - name: 문항 분할
        run: python pipeline/segment.py

      # 큐넷 국가전문자격: 사이트에 연 시험(exams.json status live)만, 새 게시물만 받는다
      - name: 큐넷 기출 수집
        run: |
          for gid in $(python -c "import json;print(' '.join(e['qnet'] for e in json.load(open('web/src/exams.json'))['exams'] if e.get('qnet') and e['status']=='live'))"); do
            python pipeline/qnet.py fetch "$gid"
            python pipeline/qnet_answers.py prepare "$gid"
          done

      # 공무원(9급·7급·지방직): 정답표가 글자 PDF 라 API 없이 읽는다. 최근 2년치만 확인
      - name: 공무원 기출 수집
        run: |
          python pipeline/gosi.py --since=$(( $(date -u +%Y) - 1 ))
          python pipeline/build_index.py

      # Claude API 인증은 Workload Identity Federation: 저장된 API 키 없이 실행마다 GitHub OIDC 토큰을
      # 단기 토큰으로 교환한다(SDK 가 아래 환경 변수를 읽어 자동 처리). ID 값들은 비밀이 아니라 repo 변수로 둔다.
      - name: 해설 (배치 수거 → 신규 제출)
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
        run: |
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] || unset ANTHROPIC_WORKSPACE_ID
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          # 인증·Batches 권한 확인 (토큰 비용 없음)
          python -c "import anthropic; c = anthropic.Anthropic(); c.models.retrieve('claude-opus-5-5'); list(c.messages.batches.list(limit=1)); print('Claude API 인증 OK')"
          # 새 큐넷 최종정답표: 그림이라 API 로 두 번 읽어 같을 때만 반영 → 문제지 만들기
          for spec in $(python -c "import json;print(' '.join(e['qnet']+':'+str(e['choices']) for e in json.load(open('web/src/exams.json'))['exams'] if e.get('qnet') and e['status']=='live'))"); do
            python pipeline/qnet_answers.py read-api "${spec%%:*}" "${spec##*:}" || true
          done
          python pipeline/qnet_build.py
          python pipeline/build_index.py
          python pipeline/explain.py collect
          python pipeline/explain.py submit ${{ inputs.explain_limit && format('--limit {0}', inputs.explain_limit) || '' }}

      - name: 변경 사항 커밋
        run: |
          git config user.name "psat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data
          git diff --cached --quiet || git commit -m "data: 자동 업데이트 $(date -u +%F)"
          git push

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_CONTACT: ${{ vars.CONTACT }}
          VITE_AD_CLIENT: ${{ vars.AD_CLIENT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
